spring:
  application:
    name: sifap-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sifap}
    username: ${SPRING_DATASOURCE_USERNAME:sifap}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    doc-expansion: none
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health

sifap:
  legacy-import:
    # Carga da extração legada: operação sob demanda, desligada por padrão para
    # que subir a aplicação nunca escreva dados por conta própria.
    enabled: ${SIFAP_LEGACY_IMPORT_ENABLED:false}
    directory: ${SIFAP_LEGACY_SEED_DIR:../01-archaeology/legacy-seed-data}
